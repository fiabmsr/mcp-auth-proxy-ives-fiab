{{define "title"}}Journal{{end}}
{{define "content"}}
{{template "adminheader" .}}
<main class="page">
  <p class="eyebrow">Tableau de bord</p>
  <h1>Journal des actions</h1>
  {{if .Entries}}
  <div class="table-wrap">
    <table>
      <thead><tr><th>Date</th><th>Admin</th><th>Action</th><th>Cible</th><th>IP</th></tr></thead>
      <tbody>
      {{range .Entries}}
        <tr><td>{{date .Time}}</td><td>{{.Actor}}</td><td><code>{{.Action}}</code></td><td>{{.Target}}</td><td>{{.IP}}</td></tr>
      {{end}}
      </tbody>
    </table>
  </div>
  {{else}}
  <p class="muted">Aucune action enregistrée.</p>
  {{end}}
</main>
{{end}}
